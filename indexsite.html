<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ARTOOLS // Precision Series — A Caneta Mais Tecnológica do Mundo</title>

    <!-- =========================================================================
         1. FONTES EXTERNAS (Inter & JetBrains Mono - Conforme Design System Oficial)
         ========================================================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- =========================================================================
         2. TAILWIND CSS CDN & CONFIGURAÇÃO DO DESIGN SYSTEM
         ========================================================================= -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            body: '#ffffff',
                            surface: '#fafafa',
                            'surface-2': '#f4f4f5',
                            dark: '#09090b',
                            muted: '#71717a',
                            light: '#a1a1aa',
                            border: '#e4e4e7',
                        }
                    },
                    letterSpacing: {
                        widest2: '0.25em',
                        widest3: '0.3em',
                    }
                }
            }
        }
    </script>

    <!-- =========================================================================
         3. ICONIFY CDN (Ícones Oficiais do Sistema)
         ========================================================================= -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <!-- =========================================================================
         4. GSAP & SCROLLTRIGGER CDN (Core do Efeito Parallax/Scrubbing Apple)
         ========================================================================= -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- =========================================================================
         5. ESTILOS CUSTOMIZADOS & VARIÁVEIS DO DESIGN SYSTEM OFICIAL
         ========================================================================= -->
    <style>
        :root {
            /* Variáveis de Cor - Pure White & Studio Aesthetic (design_system_oficial1.html) */
            --bg-body: #ffffff;
            --bg-surface: #fafafa;
            --bg-surface-2: #f4f4f5;
            --text-primary: #09090b;
            --text-secondary: #71717a;
            --text-muted: #737373;
            --text-tertiary: #a1a1aa;
            --border-light: #e4e4e7;
            --brand-primary: #000000;
            --brand-inverse: #ffffff;

            /* Tipografia */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            /* Motion & Easing Apple */
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-apple: cubic-bezier(0.25, 1, 0.5, 1);
        }

        body {
            font-family: var(--font-sans);
            background-color: #f7f7f8;
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
        }

        /* -------------------------------------------------------------------------
           TEXTO VAZADO / OUTLINE SYSTEM (Conforme Seção 3 do Design System Oficial)
           ------------------------------------------------------------------------- */
        .text-outline-luxury {
            color: transparent;
            -webkit-text-stroke: 1.6px #09090b;
            position: relative;
            display: inline-block;
            transition: all 0.5s var(--ease-out-expo);
            cursor: default;
        }

        /* Efeito de preenchimento líquido no hover (Liquid Hover Fill do DS Oficial) */
        .text-outline-luxury::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 0%;
            height: 100%;
            color: #09090b;
            overflow: hidden;
            white-space: nowrap;
            transition: width 0.75s var(--ease-out-expo);
            -webkit-text-stroke: 0px transparent;
            pointer-events: none;
        }

        .text-outline-luxury:hover::before {
            width: 100%;
        }

        /* -------------------------------------------------------------------------
           OVERLAY SUTIL DE TEXTURA / NOISE (Estética Premium de Material Físico)
           ------------------------------------------------------------------------- */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.025;
            pointer-events: none;
            z-index: 999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* -------------------------------------------------------------------------
           PÍLULA DE SCROLL INFINITO (Indicador Rodapé)
           ------------------------------------------------------------------------- */
        @keyframes scroll-line {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translateY(100%);
                opacity: 0;
            }
        }

        .animate-scroll-line {
            animation: scroll-line 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        /* -------------------------------------------------------------------------
           EFEITO GLASSMORPHISM ULTRA-REFINADO (Header Apple)
           ------------------------------------------------------------------------- */
        .glass-header {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        /* Custom Scrollbar minimalista */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f7f7f8;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4d4d8;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa;
        }
    </style>
</head>

<body class="selection:bg-black selection:text-white relative">

    <!-- Camada de granulação tátil (Noise Overlay) -->
    <div class="noise-overlay"></div>

    <!-- =========================================================================
         1. NAVBAR / HEADER MINIMALISTA
         - Logo com ícone à esquerda
         - Links centralizados: DESIGN, TECHNOLOGY, SPECS
         - Ícone de sacola de compras minimalista à direita
         ========================================================================= -->
    <header id="main-navbar" class="fixed top-0 left-0 w-full z-50 glass-header transition-all duration-300">
        <div class="max-w-[1440px] mx-auto px-6 sm:px-10 lg:px-16 h-20 flex items-center justify-between">
            
            <!-- Logo (Esquerda) -->
            <a href="#" class="flex items-center gap-2.5 group cursor-pointer" aria-label="Artools Home">
                <div class="w-8 h-8 rounded-lg bg-neutral-900 flex items-center justify-center text-white shadow-sm transition-transform duration-500 group-hover:scale-105 group-hover:rotate-6">
                    <!-- Ícone Vetorial de Caneta Estilizada -->
                    <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                        <circle cx="11" cy="11" r="1.5" fill="currentColor"/>
                    </svg>
                </div>
                <span class="font-sans font-bold tracking-tight text-lg text-neutral-900 select-none">
                    ARTOOLS<span class="text-neutral-400 font-medium">.PRO</span>
                </span>
            </a>

            <!-- Links de Navegação (Centro) -->
            <nav class="hidden md:flex items-center gap-10 font-mono text-xs uppercase tracking-widest2 text-neutral-500 font-medium">
                <a href="#design" class="hover:text-black transition-colors duration-200">Design</a>
                <a href="#technology" class="hover:text-black transition-colors duration-200">Technology</a>
                <a href="#specs" class="hover:text-black transition-colors duration-200">Specs</a>
            </nav>

            <!-- Sacola de Compras (Direita) -->
            <div class="flex items-center gap-4">
                <a href="#cart" aria-label="Sacola de Compras" class="text-neutral-800 hover:text-black transition-all duration-300 hover:scale-110 active:scale-95 p-2 rounded-full hover:bg-neutral-100/60">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <path d="M16 10a4 4 0 0 1-8 0"/>
                    </svg>
                </a>
            </div>

        </div>
    </header>

    <!-- =========================================================================
         2. HERO SECTION SCROLL CONTAINER (TRILHO DE PARALLAX)
         - Altura de 350vh para fornecer o percurso ideal de rolagem no scrub do vídeo
         - Viewport interna 'sticky' mantida fixa no topo enquanto o usuário rola
         ========================================================================= -->
    <main id="hero-scroll-container" class="relative w-full" style="height: 350vh;">

        <!-- Palco Fixo na Janela de Visualização (Sticky Stage) -->
        <div class="sticky top-0 h-screen w-full overflow-hidden flex items-center justify-center">

            <!-- Fundo Studio Apple com Gradiente Radiante de Luz Suave -->
            <div class="absolute inset-0 pointer-events-none z-0"
                 style="background: radial-gradient(ellipse 85% 65% at 50% 50%, #ffffff 0%, #fafafa 45%, #f2f2f4 100%);">
            </div>

            <!-- =====================================================================
                 ELEMENTO CENTRAL: O VÍDEO vídeoof.mp4
                 - Ocupa o centro/fundo da tela exatamente como na referência
                 - Controlado frame a frame pelo scroll através do GSAP ScrollTrigger
                 - Poster inicial da captura de referência para renderização instantânea
                 ===================================================================== -->
            <div id="video-wrapper" class="absolute inset-0 z-10 flex items-center justify-center pointer-events-none overflow-hidden">
                <video
                    id="hero-video"
                    src="assets/raw_files/videoof.mp4"
                    poster="assets/raw_files/Captura de tela 2026-11-05 103127.png"
                    playsinline
                    webkit-playsinline
                    muted
                    preload="auto"
                    class="w-full h-full object-contain pointer-events-none select-none transition-transform duration-100 ease-out"
                    style="transform-origin: center center;"
                >
                    <source src="assets/raw_files/videoof.mp4" type="video/mp4" />
                </video>
            </div>

            <!-- =====================================================================
                 CAMADA DE CONTEÚDO (Tipografia, Parágrafo e Botões de Ação)
                 ===================================================================== -->
            <div class="relative z-20 w-full max-w-[1440px] mx-auto px-6 sm:px-10 lg:px-16 pointer-events-none">
                <div id="hero-text-container" class="max-w-2xl text-left pointer-events-auto">

                    <!-- Título Monumental Apple-Style com Tipografia Híbrida (Sólido + Outline) -->
                    <h1 id="hero-title" class="font-sans text-5xl sm:text-6xl md:text-7xl lg:text-[5.4rem] xl:text-[6.2rem] font-extrabold tracking-[-0.035em] leading-[0.93] text-neutral-900 select-none">
                        <span class="hero-anim-item block">A caneta</span>
                        <span class="hero-anim-item block my-1">
                            <span class="text-outline-luxury" data-text="mais tecnológica">mais tecnológica</span>
                        </span>
                        <span class="hero-anim-item block">do mundo.</span>
                    </h1>

                    <!-- Parágrafo Descritivo Altamente Legível -->
                    <p id="hero-paragraph" class="hero-anim-item text-base sm:text-lg md:text-xl text-neutral-600 font-light leading-relaxed max-w-lg mt-7 mb-9">
                        A Artools Precision Pen redefine o equilíbrio entre peso, fluxo e design. Feita para criadores que exigem perfeição em cada traço.
                    </p>

                    <!-- Botões de Ação Alinhados Horizontalmente -->
                    <div id="hero-buttons" class="hero-anim-item flex flex-wrap items-center gap-4">
                        
                        <!-- Botão Primário Escuro: "Comprar Agora" -->
                        <a href="#comprar"
                           class="group relative inline-flex items-center justify-center px-8 sm:px-9 py-3.5 sm:py-4 rounded-full bg-neutral-950 text-white text-sm font-medium tracking-wide shadow-[0_10px_25px_-5px_rgba(0,0,0,0.25)] hover:shadow-[0_15px_35px_-5px_rgba(0,0,0,0.35)] hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 overflow-hidden">
                            <!-- Efeito Shimmer sutil no hover -->
                            <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000 ease-out"></span>
                            <span class="relative z-10 flex items-center gap-2">
                                <span>Comprar Agora</span>
                            </span>
                        </a>

                        <!-- Botão Secundário Claro: "Explorar ↓" -->
                        <a href="#explorar"
                           id="btn-explorar"
                           class="group inline-flex items-center justify-center gap-2 px-8 sm:px-9 py-3.5 sm:py-4 rounded-full bg-white text-neutral-900 text-sm font-medium tracking-wide border border-neutral-200/80 shadow-[0_4px_20px_rgba(0,0,0,0.06)] hover:shadow-[0_8px_25px_rgba(0,0,0,0.1)] hover:border-neutral-300 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300">
                            <span>Explorar</span>
                            <span class="inline-block transform group-hover:translate-y-1 transition-transform duration-300 text-base leading-none">↓</span>
                        </a>

                    </div>

                </div>
            </div>

            <!-- =====================================================================
                 DETALHE LATERAL DIREITO: Indicador "01" com Linha Vertical
                 ===================================================================== -->
            <div id="side-indicator" class="hidden md:flex fixed right-8 lg:right-12 top-1/2 -translate-y-1/2 flex-col items-center gap-4 z-30 select-none pointer-events-none">
                <span class="font-mono text-xs font-semibold tracking-wider text-neutral-800">01</span>
                <div class="w-px h-14 bg-neutral-900/90"></div>
            </div>

            <!-- =====================================================================
                 RODAPÉ CENTRALIZADO: Indicador Sutil "SCROLL TO CONTROL"
                 ===================================================================== -->
            <div id="scroll-hint" class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2.5 z-30 pointer-events-none select-none">
                <span class="font-mono text-[10px] sm:text-[11px] uppercase tracking-widest2 text-neutral-400 font-medium">SCROLL TO CONTROL</span>
                <div class="w-px h-8 bg-neutral-300/80 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-full bg-neutral-900 animate-scroll-line"></div>
                </div>
            </div>

        </div>

    </main>

    <!-- =========================================================================
         SCRIPT DE COMPORTAMENTO E ANIMAÇÕES (GSAP + SCROLLTRIGGER + VIDEO SCRUB)
         ========================================================================= -->
    <script>
        // Registra o plugin ScrollTrigger no GSAP
        gsap.registerPlugin(ScrollTrigger);

        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('hero-video');
            const scrollContainer = document.getElementById('hero-scroll-container');
            const heroTextContainer = document.getElementById('hero-text-container');
            const scrollHint = document.getElementById('scroll-hint');
            const sideIndicator = document.getElementById('side-indicator');
            const btnExplorar = document.getElementById('btn-explorar');

            // 1. Configurações fundamentais para scrubbing de vídeo no navegador
            video.pause();
            video.muted = true;
            video.load(); // Eager buffer

            /* =====================================================================
               2. ANIMAÇÕES DE ENTRADA SUAVES (PAGE LOAD REVEAL)
               Textos e botões entram com fade in + slide up leve + blur out
               ===================================================================== */
            const entranceTimeline = gsap.timeline({
                defaults: { ease: "power3.out" }
            });

            // Animação da Navbar
            entranceTimeline.from("#main-navbar", {
                y: -25,
                opacity: 0,
                duration: 1.1,
            }, 0);

            // Animação do Vídeo (Fade in com leve escala de aproximação cinematográfica)
            entranceTimeline.from(video, {
                opacity: 0,
                scale: 1.05,
                duration: 1.6,
                ease: "power2.out"
            }, 0.1);

            // Animação dos elementos de texto e botões em cascata suave (stagger)
            entranceTimeline.from(".hero-anim-item", {
                y: 36,
                opacity: 0,
                filter: "blur(8px)",
                duration: 1.2,
                stagger: 0.14
            }, 0.25);

            // Animação dos indicadores laterais e de rodapé
            entranceTimeline.from([sideIndicator, scrollHint], {
                opacity: 0,
                duration: 1.4
            }, 0.7);

            /* =====================================================================
               3. VÍDEO PARALLAX VIA SCROLL (O EFEITO "APPLE" SCRUBBING)
               - Conforme o usuário rola para baixo, o vídeo avança frame a frame.
               - Conforme rola para cima, o vídeo retrocede.
               - scrub: 0.6 adiciona a inércia ultra-fluida característica dos produtos Apple.
               ===================================================================== */
            let isScrubInitialized = false;

            function setupVideoScrollTrigger() {
                if (isScrubInitialized) return;
                isScrubInitialized = true;

                // Duração do arquivo de vídeo (com fallback preciso para os 7.85s do videoof.mp4)
                const duration = (video.duration && !isNaN(video.duration) && video.duration > 0) ? video.duration : 7.85;

                // Garante que o primeiro quadro seja renderizado imediatamente
                if (video.currentTime === 0) {
                    video.currentTime = 0.001;
                }

                // Cria o Tween GSAP amarrado ao ScrollTrigger
                gsap.to(video, {
                    currentTime: duration - 0.05, // Margem de segurança de 0.05s para evitar black-frame no final
                    ease: "none",
                    scrollTrigger: {
                        trigger: scrollContainer,
                        start: "top top",
                        end: "bottom bottom",
                        scrub: 0.6, // Suavização inercial (momentum scrubbing Apple)
                        invalidateOnRefresh: true,
                    }
                });

                // Parallax suave dos textos: recuam sutilmente conforme o usuário aprofunda no produto
                gsap.to(heroTextContainer, {
                    y: -60,
                    opacity: 0.15,
                    filter: "blur(4px)",
                    ease: "power1.out",
                    scrollTrigger: {
                        trigger: scrollContainer,
                        start: "18% top",
                        end: "70% top",
                        scrub: 0.5,
                    }
                });

                // Oculta gradualmente o aviso "SCROLL TO CONTROL" assim que a rolagem começa
                gsap.to(scrollHint, {
                    opacity: 0,
                    y: 20,
                    ease: "power1.out",
                    scrollTrigger: {
                        trigger: scrollContainer,
                        start: "top top",
                        end: "8% top",
                        scrub: 0.3,
                    }
                });

                ScrollTrigger.refresh();
            }

            // Inicializa o controle do vídeo com detecção resiliente de metadados
            if (video.readyState >= 1) {
                setupVideoScrollTrigger();
            } else {
                video.addEventListener('loadedmetadata', setupVideoScrollTrigger, { once: true });
                video.addEventListener('canplay', setupVideoScrollTrigger, { once: true });
                // Fallback de segurança para garantir a inicialização
                setTimeout(setupVideoScrollTrigger, 400);
            }

            /* =====================================================================
               4. INTERATIVIDADE DO BOTÃO "EXPLORAR ↓"
               Ao clicar, realiza um scroll suave pelo trilho do produto
               ===================================================================== */
            if (btnExplorar) {
                btnExplorar.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetScroll = scrollContainer.offsetTop + (scrollContainer.offsetHeight * 0.45);
                    window.scrollTo({
                        top: targetScroll,
                        behavior: 'smooth'
                    });
                });
            }

            /* =====================================================================
               5. MICRO-INTERAÇÃO MOUSE PARALLAX TILT (Efeito Vitrine Holográfica Apple)
               Um sutil deslocamento 3D ao mover o mouse pela tela na área desktop
               ===================================================================== */
            if (window.matchMedia("(min-width: 1024px)").matches) {
                window.addEventListener('mousemove', (e) => {
                    const normX = (e.clientX / window.innerWidth - 0.5) * 2;
                    const normY = (e.clientY / window.innerHeight - 0.5) * 2;

                    // Deslocamento sutil do elemento de vídeo
                    gsap.to(video, {
                        x: normX * 10,
                        y: normY * 10,
                        rotateY: normX * 2,
                        rotateX: -normY * 2,
                        duration: 1.4,
                        ease: "power2.out"
                    });
                });
            }
        });
    </script>
</body>

</html>
